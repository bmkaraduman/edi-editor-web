<header class="top gutter" id="top">
  <div class="top-in">
    <a class="brand" href="/" id="home"><span class="mark">🎁</span>gift<span class="tld">detect</span><span class="dot">.com</span></a>
    <a class="nav-blog" id="nav-blog" href="/blog/">Blog</a>
    <div class="settings" id="settings">
      <button type="button" class="settings-btn" id="settings-btn" aria-haspopup="menu" aria-expanded="false">
        <span class="settings-flag" id="settings-flag"></span>
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9h17M3.5 15h17" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
      </button>
      <div class="settings-pop" id="settings-pop" role="menu" hidden></div>
    </div>
  </div>
</header>
<div class="hero gutter" id="hero">
  <div class="hero-in">
    <div class="confetti" aria-hidden="true"><span>🎀</span><span>🎈</span><span>✨</span><span>🎂</span><span>💝</span><span>🎉</span></div>
    <h1 id="t-hero"></h1>
    <p id="t-sub"></p>
  </div>
</div>
<div class="bar-wrap gutter" id="bar-wrap">
  <form class="bar" id="bar" autocomplete="off">
    <div class="field f-gender" data-facet="gender"><span id="l-gender"></span><button type="button" class="pick-btn" aria-haspopup="dialog" aria-expanded="false"></button><div class="pick-pop" role="dialog" hidden></div></div>
    <div class="field f-age" data-facet="age"><span id="l-age"></span><button type="button" class="pick-btn" aria-haspopup="dialog" aria-expanded="false"></button><div class="pick-pop" role="dialog" hidden></div></div>
    <div class="field f-occasion" data-facet="occasion"><span id="l-occasion"></span><button type="button" class="pick-btn" aria-haspopup="dialog" aria-expanded="false"></button><div class="pick-pop" role="dialog" hidden></div></div>
    <div class="field f-personality" data-facet="personality"><span id="l-personality"></span><button type="button" class="pick-btn" aria-haspopup="dialog" aria-expanded="false"></button><div class="pick-pop" role="dialog" hidden></div></div>
    <div class="field f-budget" data-facet="budget"><span id="l-budget"></span><button type="button" class="pick-btn" aria-haspopup="dialog" aria-expanded="false"></button><div class="pick-pop" role="dialog" hidden></div></div>
    <button type="submit" class="go" id="go"></button>
  </form>
  <div class="adv-row" id="adv-row">
    <button type="button" class="adv-toggle" id="adv-toggle" aria-expanded="false" aria-controls="adv">
      <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span id="t-adv"></span><span class="adv-count" id="adv-count" hidden></span><span class="chev" aria-hidden="true"></span>
    </button>
  </div>
  <section class="adv" id="adv" hidden>
    <div class="pick-head"><b id="t-adv-title"></b><button type="button" class="adv-clear" id="adv-clear"></button></div>
    <p class="adv-sub" id="t-adv-sub"></p>
    <div class="tiles cat-tiles" id="cats"></div>
  </section>
  <div class="examples" id="examples"></div>
</div>
<section class="upcoming gutter" id="upcoming-wrap" hidden>
  <div class="upcoming-in">
    <div class="head"><div><h2 id="up-title"></h2><div class="count" id="up-sub"></div></div><button type="button" class="up-all" id="up-all"></button></div>
    <section class="grid" id="upcoming"></section>
  </div>
</section>
<main class="results gutter" id="results-wrap" hidden>
  <div class="results-in">
    <div class="demo" id="demo" hidden></div>
    <div class="head">
      <div><h2 id="title"></h2><div class="count" id="count"></div></div>
      <label class="sort"><span id="t-sort"></span><select id="sort"></select></label>
    </div>
    <section class="grid" id="results"></section>
    <div class="more"><button type="button" id="more" hidden></button></div>
  </div>
</main>
<section class="product-page gutter" id="product-wrap" hidden>
  <div class="product-in">
    <a class="back" href="/" id="back"></a>
    <div class="product" id="product"></div>
    <h3 class="similar-title" id="t-similar"></h3>
    <section class="grid" id="similar"></section>
  </div>
</section>
<footer class="gutter"><p id="t-disclosure"></p><p id="stats"></p></footer>
